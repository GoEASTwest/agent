spring:
  application:
    name: ai-agent
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_agent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:${api_key:}}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-turbo}
    mcp:
      client:
        request-timeout: 30s
        stdio:
          servers-configuration: classpath:mcp-servers.json
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.mcp.client.McpClientAutoConfiguration
      - org.springframework.ai.autoconfigure.mcp.client.StdioTransportAutoConfiguration
#    vectorstore:
